[project]
name = "napcat-sdk"
version = "0.6.8"
description = "NapCat SDK for Python - Fully typed and async ready"
readme = "README.md"
license = { text = "MIT License" }
authors = [{ name = "吴天一", email = "faithleysath@gmail.com" }]
requires-python = ">=3.12"
keywords = ["napcat", "sdk", "api", "async", "typed"]               # 方便在 PyPI 搜索
# 这里是关键的元数据增强
classifiers = [
    # 开发状态 (3 - Alpha, 4 - Beta, 5 - Production/Stable)
    "Development Status :: 3 - Alpha",

    # 受众
    "Intended Audience :: Developers",

    # 许可证 (请根据实际情况选择，这里假设是 MIT)
    "License :: OSI Approved :: MIT License",

    # 编程语言版本
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    # 操作系统
    "Operating System :: OS Independent",

    # *** 关键：声明这是一个包含类型注解的包 ***
    "Typing :: Typed",

    # 话题
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "orjson>=3.11.9",
    "websockets>=16.0",
]

[project.urls]
"Homepage" = "https://github.com/faithleysath/napcat-sdk"
"Repository" = "https://github.com/faithleysath/napcat-sdk"
"Documentation" = "https://faithleysath.github.io/napcat-sdk/"
"NapCat" = "https://napneko.github.io"
"Bug Tracker" = "https://github.com/faithleysath/napcat-sdk/issues"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "napcat"

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/napcat/__init__.py" = ["F403", "F405"]
"src/napcat/types/__init__.py" = ["F403", "F405"]
"src/napcat/types/events/__init__.py" = ["F403", "F405"]

[tool.pytest.ini_options]
markers = ["static: run static quality checks (ruff/pyright)"]
