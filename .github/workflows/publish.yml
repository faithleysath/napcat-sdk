name: "Publish"

on:
  push:
    tags:
      # Publish on any tag starting with a `v`, e.g., v0.1.0
      - v*

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: uv sync --frozen --group dev --python ${{ matrix.python-version }}
      - name: Run source tests
        run: uv run --python ${{ matrix.python-version }} pytest -q src/tests -m "not static"
      - name: Build
        run: uv build
      - name: Run tests against wheel package (${{ matrix.python-version }})
        run: uv run --python ${{ matrix.python-version }} --isolated --no-project --with dist/*.whl --with pytest pytest -q src/tests -m "not static"
      - name: Run tests against source distribution package (${{ matrix.python-version }})
        run: uv run --python ${{ matrix.python-version }} --isolated --no-project --with dist/*.tar.gz --with pytest pytest -q src/tests -m "not static"

  publish:
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Build
        run: uv build
      - name: Publish
        run: uv publish